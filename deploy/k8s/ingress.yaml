apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpvn
  annotations:
    cert-manager.io/cluster-issuer: staging-letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # A 10 MiB attachment plus multipart headers; the app enforces file limits.
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "65"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [grpvn.offbyte.com]
      secretName: grpvn-offbyte-com-tls
  rules:
    - host: grpvn.offbyte.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grpvn
                port:
                  name: http
