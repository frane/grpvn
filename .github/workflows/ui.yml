name: Human clients
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: git diff --exit-code -- ui/dist
      - run: go build -o .build/grpvn ./cmd/grpvn
      - run: go build -o .build/grpvn-ui-testhost ./ui/tests/host
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm test
        working-directory: ui
        env: {GRPVN_TEST_BIN: '${{ github.workspace }}/.build/grpvn', GRPVN_TEST_UI_HOST: '${{ github.workspace }}/.build/grpvn-ui-testhost'}
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: grpvn-ci-only}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: go test -race ./internal -count=1 -timeout=360s
        env: {GRPVN_TEST_POSTGRES: 'postgres://postgres:grpvn-ci-only@localhost:5432/postgres?sslmode=disable'}
  desktop:
    strategy:
      fail-fast: false
      matrix: {os: [macos-latest, windows-latest, ubuntu-latest]}
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26'}
      - name: Linux native webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Test desktop actions
        working-directory: desktop
        run: go test ./...
      - name: Build desktop
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          go build -trimpath -tags production -ldflags '-s -w' -o bin/grpvn-desktop .
          mkdir -p bin/share/applications bin/share/icons/hicolor/512x512/apps
          cp com.offbyte.grpvn.desktop bin/share/applications/
          cp icons/linux.png bin/share/icons/hicolor/512x512/apps/com.offbyte.grpvn.png
          tar -czf bin/grpvn-desktop-linux-${{ runner.arch }}.tar.gz -C bin grpvn-desktop share
      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: desktop
        run: go build -trimpath -tags production -ldflags '-H windowsgui -s -w' -o bin/grpvn-desktop.exe .
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        working-directory: desktop
        run: sh package-macos.sh
      - uses: actions/upload-artifact@v4
        with: {name: 'grpvn-desktop-${{ runner.os }}', path: desktop/bin/}
