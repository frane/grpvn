name: release

on:
  push:
    tags:
      - 'v*'
  # Manual releases: dispatching with a tag name creates the tag on the
  # workflow's HEAD and releases it in the same run. (A tag pushed with
  # GITHUB_TOKEN would not re-trigger the on-push path, so goreleaser runs
  # here directly.)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.2.0)"
        required: true
      npm-only:
        description: "Only publish the npm launcher for an already-released tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  # npm trusted publishing: the workflow authenticates to npmjs.com via
  # GitHub's OIDC token — no NPM_TOKEN secret anywhere.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Homebrew publishing credentials
        if: ${{ !inputs.npm-only }}
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is required to publish frane/homebrew-tap. Refusing an incomplete release."
            exit 1
          fi
      # npm-only mode: the tag already exists and its binaries are already
      # released; check the tag out so the launcher published matches it.
      - name: Check out existing tag (npm-only)
        if: github.event_name == 'workflow_dispatch' && inputs.npm-only
        run: git checkout "refs/tags/${{ github.event.inputs.tag }}"
      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && !inputs.npm-only
        run: |
          TAG="${{ github.event.inputs.tag }}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like v0.2.0, got: $TAG"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          # No force on the push: an existing remote tag pointing elsewhere
          # should fail loudly instead of being moved.
          git push origin "refs/tags/$TAG"
      - name: Set up Go
        if: ${{ !inputs.npm-only }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run tests
        if: ${{ !inputs.npm-only }}
        run: go test -race ./... -count=1
      - name: Install GoReleaser through the asset API
        if: ${{ !inputs.npm-only }}
        shell: bash
        run: |
          RELEASE_TOOLS="$RUNNER_TEMP/grpvn-release-tools"
          mkdir -p "$RELEASE_TOOLS"
          gh api repos/goreleaser/goreleaser/releases/latest > "$RELEASE_TOOLS/release.json"
          ARCHIVE_URL=$(jq -r '.assets[] | select(.name == "goreleaser_Linux_x86_64.tar.gz") | .url' "$RELEASE_TOOLS/release.json")
          CHECKSUM_URL=$(jq -r '.assets[] | select(.name == "checksums.txt") | .url' "$RELEASE_TOOLS/release.json")
          gh api -H 'Accept: application/octet-stream' "$ARCHIVE_URL" > "$RELEASE_TOOLS/goreleaser_Linux_x86_64.tar.gz"
          gh api -H 'Accept: application/octet-stream' "$CHECKSUM_URL" > "$RELEASE_TOOLS/checksums.txt"
          cd "$RELEASE_TOOLS"
          grep '  goreleaser_Linux_x86_64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf goreleaser_Linux_x86_64.tar.gz goreleaser
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        if: ${{ !inputs.npm-only }}
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out Homebrew tap
        if: ${{ !inputs.npm-only }}
        uses: actions/checkout@v4
        with:
          repository: frane/homebrew-tap
          ref: main
          path: .homebrew-tap
          # Write access to this tap only; no account-wide personal token.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Publish and verify Homebrew cask
        if: ${{ !inputs.npm-only }}
        env:
          GRPVN_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -s dist/homebrew/Casks/grpvn.rb
          cp dist/homebrew/Casks/grpvn.rb .homebrew-tap/Casks/grpvn.rb
          cd .homebrew-tap
          git config user.name grpvn-release
          git config user.email release@grpvn.dev
          git add Casks/grpvn.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update grpvn to $GRPVN_RELEASE_TAG"
            git push origin HEAD:main
          fi
          git fetch origin main
          git show origin/main:Casks/grpvn.rb | cmp - Casks/grpvn.rb
          grep -F "version \"${GRPVN_RELEASE_TAG#v}\"" Casks/grpvn.rb
      # Publishes the npm launcher (grpvn-cli) at the tag's version via npm
      # trusted publishing: npmjs.com is configured to trust this workflow's
      # OIDC identity (repo frane/grpvn, workflow release.yml), so there is
      # no token. Requires npm >= 11.5.1 for the OIDC exchange; provenance
      # comes with it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish npm launcher
        run: |
          npm install -g npm@latest
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd npm
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          npm publish --access public
